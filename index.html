<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Emblem Stat Growth Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg: #020817;
        --bg-panel: #111827;
        --panel-alt: #0f172a;
        --panel-soft: #1e293b;
        --gold: #facc15;
        --gold-soft: #f59e0b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #475569;
        --green: #22c55e;
        --red: #ef4444;
        --shadow: rgba(15, 23, 42, 0.9);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem 1rem;
        background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .shell {
        max-width: 1280px;
        margin: 0 auto;
        border: 2px solid var(--border);
        border-radius: 1.25rem;
        background: rgba(15, 23, 42, 0.96);
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        padding: 1.5rem;
      }

      .header {
        text-align: center;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
        margin-bottom: 1.5rem;
      }

      .title {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        color: var(--gold);
        margin: 0;
      }

      .subtitle {
        color: var(--muted);
        margin-top: 0.5rem;
        font-size: 0.9rem;
      }

      .hero-row {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 1.25rem;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
      }

      .portrait-box {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .portrait {
        width: 128px;
        height: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.9rem;
        border: 2px solid rgba(250, 204, 21, 0.8);
        background: linear-gradient(135deg, rgba(245,158,11,.18), rgba(15, 23, 42, 1));
        font-size: 4rem;
        overflow: hidden;
        box-shadow: inset 0 0 25px rgba(0,0,0,.2);
      }

      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .upload-btn {
        margin-top: 0.75rem;
        cursor: pointer;
        border-radius: 0.6rem;
        background: #374151;
        color: #e5e7eb;
        font-weight: 700;
        padding: 0.5rem 0.9rem;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }

      .remove-btn {
        margin-top: 0.4rem;
        font-size: 0.72rem;
        color: #fca5a5;
        background: transparent;
        border: none;
        cursor: pointer;
        display: none;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(200px, 1fr));
        gap: 1rem;
      }

      .label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .input, .num, select, textarea {
        width: 100%;
        border-radius: 0.55rem;
        border: 1px solid var(--border);
        background: #334155;
        color: white;
        padding: 0.6rem 0.7rem;
        outline: none;
      }

      .input:focus, .num:focus, select:focus, textarea:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.12);
      }

      .input.full-span { grid-column: 1 / -1; }

      .banner-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
      }

      .level-box {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--gold);
        font-weight: 900;
        font-size: 1.8rem;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }

      button {
        border: none;
        border-radius: 0.65rem;
        padding: 0.72rem 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      button:hover { filter: brightness(1.05); }
      button:active { transform: translateY(1px); }

      .btn-primary { background: linear-gradient(180deg, #facc15, #d97706); color: #111827; }
      .btn-green { background: linear-gradient(180deg, #22c55e, #16a34a); color: white; }
      .btn-blue { background: linear-gradient(180deg, #3b82f6, #2563eb); color: white; }
      .btn-slate { background: linear-gradient(180deg, #475569, #334155); color: white; }
      .btn-red { background: linear-gradient(180deg, #ef4444, #b91c1c); color: white; }

      .stats-panel {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.8rem;
      }

      .stat-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.9rem 1rem;
        border: 1px solid rgba(250, 204, 21, 0.25);
        border-radius: 0.7rem;
        background: rgba(30, 41, 59, 0.8);
      }

      .stat-name {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--gold);
      }

      .stat-value-wrap {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .stat-value {
        font-size: 1.4rem;
        font-weight: 900;
      }

      .gain-badge {
        color: var(--green);
        font-weight: 900;
        font-size: 1rem;
        opacity: 0;
        transform: translateY(4px);
      }

      .gain-badge.show {
        animation: pop 0.8s ease-out forwards;
      }

      @keyframes pop {
        0% { opacity: 0; transform: translateY(4px); }
        20% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-8px); }
      }

      .settings {
        margin-bottom: 1.5rem;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 1rem;
        overflow: hidden;
      }

      .settings-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.9rem 1rem;
        background: rgba(30, 41, 59, 0.8);
        color: var(--gold);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .settings-body {
        display: none;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.8rem;
        padding: 1rem;
      }

      .settings.open .settings-body { display: grid; }

      .check {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(250, 204, 21, 0.2);
        border-radius: 0.6rem;
        padding: 0.75rem 0.8rem;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .check input { accent-color: var(--gold); }

      .subgrid {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .panel {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
      }

      .panel-title {
        margin: 0 0 0.8rem;
        color: var(--gold);
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      textarea {
        min-height: 170px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
        background: rgba(15, 23, 42, 0.9);
        color: #bbf7d0;
      }

      .history-list {
        display: grid;
        gap: 0.6rem;
        max-height: 250px;
        overflow-y: auto;
      }

      .history-item {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(250, 204, 21, 0.15);
        border-radius: 0.7rem;
        padding: 0.6rem 0.7rem;
        font-size: 0.8rem;
      }

      .compare-box {
        margin-top: 1.5rem;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      th, td {
        padding: 0.6rem 0.5rem;
        border-bottom: 1px solid rgba(250, 204, 21, 0.15);
        text-align: left;
      }

      .file-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .file-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #475569, #334155);
        color: white;
        border-radius: 0.65rem;
        padding: 0.72rem 1rem;
        font-weight: 800;
        cursor: pointer;
      }

      .file-label input { display: none; }

      .level-popup {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(2, 8, 23, 0.7);
        z-index: 50;
      }

      .level-popup.show { display: grid; }

      .popup-card {
        width: min(600px, 90vw);
        border: 2px solid var(--gold);
        background: rgba(15, 23, 42, 0.97);
        border-radius: 1rem;
        padding: 1.2rem;
        text-align: center;
      }

      .popup-title {
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-weight: 800;
        font-size: 0.8rem;
      }

      .popup-level {
        font-size: clamp(2rem, 5vw, 3.25rem);
        font-weight: 900;
        color: var(--gold);
        margin: 0.5rem 0 1rem;
      }

      .popup-gains {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
      }

      .popup-gain {
        display: inline-block;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.7);
        color: #dcfce7;
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 800;
      }

      @media (max-width: 768px) {
        .hero-row { grid-template-columns: 1fr; }
        .form-grid { grid-template-columns: 1fr; }
        .subgrid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <h1 class="title">🛡️ FE STAT GROWTH SIMULATOR</h1>
        <p class="subtitle">Customize your character, class, portrait, and simulate growths over time.</p>
      </header>

      <section class="hero-row">
        <div class="portrait-box">
          <div id="portrait" class="portrait">🧙</div>
          <label for="portraitInput" class="upload-btn">Upload Portrait</label>
          <input id="portraitInput" type="file" accept="image/*" hidden />
          <button id="removePortrait" class="remove-btn" type="button">Remove Portrait</button>
        </div>

        <div class="form-grid">
          <label>
            <span class="label">Title / Role</span>
            <input id="title" class="input" type="text" value="Lord" />
          </label>

          <label>
            <span class="label">Character Name</span>
            <input id="name" class="input" type="text" value="Eve" />
          </label>

          <label>
            <span class="label">Game Preset</span>
            <select id="gameSelect" class="input">
              <option value="generic">Generic</option>
              <option value="fe7">FE7</option>
              <option value="fe8">FE8</option>
              <option value="fe9">FE9</option>
              <option value="fe10">FE10</option>
              <option value="fe13">FE13</option>
              <option value="fe14">FE14</option>
              <option value="fe16">FE16</option>
            </select>
          </label>

          <label>
            <span class="label">Class</span>
            <select id="class" class="input">
              <option value="custom">Custom</option>
              <option value="Lord">Lord</option>
              <option value="Cavalier">Cavalier</option>
              <option value="Knight">Knight</option>
              <option value="Mage">Mage</option>
              <option value="Myrmidon">Myrmidon</option>
              <option value="Thief">Thief</option>
              <option value="Cleric">Cleric</option>
              <option value="Archer">Archer</option>
            </select>
          </label>

          <div class="button-row full-span">
            <button id="apply" class="btn-primary" type="button">Apply Class Growths</button>
            <button id="sound" class="btn-slate" type="button">🔊 Sound On</button>
          </div>
        </div>
      </section>

      <section class="banner-row">
        <div class="level-box">Lv <span id="level">1</span></div>

        <div class="button-row">
          <label>
            <span class="label">Levels</span>
            <input id="amount" class="num" type="number" min="1" value="1" />
          </label>
          <button id="simulate" class="btn-green" type="button">Simulate</button>
          <button id="levelUp" class="btn-primary" type="button">Level Up</button>
          <button id="reset" class="btn-slate" type="button">Reset</button>
        </div>
      </section>

      <section class="stats-panel">
        <div id="statGrid" class="stat-grid"></div>
      </section>

      <section class="settings" id="settingsPanel">
        <div class="settings-head" id="settingsToggle">
          <span>Advanced Settings</span>
          <span id="settingsText">Show</span>
        </div>
        <div class="settings-body">
          <label class="check"><input id="statCaps" type="checkbox" /> Enable stat caps</label>
          <label class="check"><input id="classGrowths" type="checkbox" checked /> Enable class growths</label>
          <label class="check"><input id="expectedValues" type="checkbox" checked /> Show expected values</label>
          <label class="check"><input id="historyToggle" type="checkbox" checked /> Show level history</label>
          <label class="check"><input id="gameRules" type="checkbox" /> Use game-specific rules</label>
          <label class="check"><input id="promotionMode" type="checkbox" /> Promotion mode</label>
        </div>
      </section>

      <div class="subgrid">
        <div class="panel">
          <h3 class="panel-title">Discord Ready Output</h3>
          <button id="copy" class="btn-blue" type="button" style="margin-bottom:0.75rem;">Copy Text</button>
          <textarea id="output" readonly></textarea>
        </div>

        <div class="panel">
          <h3 class="panel-title">Level History</h3>
          <div id="history" class="history-list"></div>
        </div>
      </div>

      <div class="compare-box">
        <div class="button-row" style="margin-bottom:0.9rem;">
          <button id="saveCompare" class="btn-slate" type="button">Save Build</button>
          <button id="compare" class="btn-blue" type="button">Compare</button>
        </div>
        <div id="comparison">No comparison saved yet.</div>
      </div>

      <div class="file-bar">
        <button id="export" class="btn-blue" type="button">Export JSON</button>
        <label class="file-label">
          Import JSON
          <input id="import" type="file" accept="application/json" />
        </label>
        <button id="save" class="btn-green" type="button">Save Build</button>
        <button id="load" class="btn-slate" type="button">Load Build</button>
      </div>
    </div>

    <div id="popup" class="level-popup" aria-live="polite">
      <div class="popup-card">
        <div class="popup-title">Level Up</div>
        <div id="popupLevel" class="popup-level">Lv 2</div>
        <div id="popupGains" class="popup-gains"></div>
        <button id="closePopup" class="btn-primary" type="button" style="margin-top:1rem;">Continue</button>
      </div>
    </div>

    <script>
      const statMeta = [
        ['hp', 'HP', 22, 65],
        ['str', 'Str', 7, 50],
        ['mag', 'Mag', 1, 10],
        ['skl', 'Skl', 8, 55],
        ['spd', 'Spd', 9, 50],
        ['lck', 'Lck', 7, 45],
        ['def', 'Def', 6, 35],
        ['res', 'Res', 2, 25],
      ];

      const classGrowths = {
        Lord: [65, 50, 10, 55, 50, 45, 35, 25],
        Cavalier: [70, 45, 5, 45, 45, 35, 40, 15],
        Knight: [80, 55, 0, 35, 15, 25, 65, 5],
        Mage: [45, 10, 70, 45, 40, 35, 10, 55],
        Myrmidon: [50, 40, 5, 65, 70, 45, 20, 15],
        Thief: [45, 35, 5, 50, 65, 60, 15, 25],
        Cleric: [40, 5, 65, 35, 35, 50, 10, 65],
        Archer: [55, 45, 5, 70, 40, 35, 25, 15],
      };

      const defaultStats = {};
      statMeta.forEach(([key, label, base, growth]) => { defaultStats[key] = base; });

      let stats = { ...defaultStats };
      let level = 1;
      let history = [];
      let savedCompare = null;
      let soundEnabled = true;
      let settingsOpen = false;

      function setHeroName() {
        const title = document.getElementById('title').value.trim() || 'Lord';
        const name = document.getElementById('name').value.trim() || 'Eve';
        document.getElementById('title').value = title;
        document.getElementById('name').value = name;
      }

      function getGrowthInput(key) {
        return document.getElementById(`growth-${key}`);
      }

      function renderStats() {
        const grid = document.getElementById('statGrid');
        grid.innerHTML = statMeta.map(([key, label, base, growth]) => `
          <div class="stat-card">
            <div class="stat-name">${label}</div>
            <div class="stat-value-wrap">
              <span class="stat-value">${stats[key]}</span>
              <span class="gain-badge" data-gain="${key}">+1</span>
            </div>
          </div>
        `).join('');

        statMeta.forEach(([key, label, base, growth]) => {
          const hidden = document.createElement('input');
          hidden.id = `growth-${key}`;
          hidden.type = 'hidden';
          hidden.value = growth;
          document.body.appendChild(hidden);
        });
      }

      function renderHistory() {
        const historyEl = document.getElementById('history');
        if (!history.length) {
          historyEl.innerHTML = '<div class="history-item"><strong>Level 1</strong><div>No gains yet.</div></div>';
          return;
        }
        historyEl.innerHTML = history.map(entry => `
          <div class="history-item">
            <strong>Level ${entry.level}</strong>
            <div>${entry.gains.length ? entry.gains.join(', ') : 'No gains'}</div>
          </div>
        `).join('');
      }

      function updateOutput(gains) {
        const charName = `${document.getElementById('title').value.trim()} ${document.getElementById('name').value.trim()}`.trim() || 'Character';
        const statsText = statMeta.map(([key]) => `${key.toUpperCase()}:${stats[key]}`).join(' | ');
        const output = `**${charName} reached Level ${level}!**\n⚔️ **Class:** ${document.getElementById('class').value}\n✨ **Gains:** ${gains.length ? gains.join(', ') : 'No stats went up!'}\n📊 **New Stats:** ${statsText}`;
        document.getElementById('output').value = output;
      }

      function playChime() {
        if (!soundEnabled) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + index * 0.09;
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.08, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.3);
        });
      }

      function showPopup(gains) {
        document.getElementById('popupLevel').textContent = `Lv ${level}`;
        const popupGains = document.getElementById('popupGains');
        popupGains.innerHTML = gains.length ? gains.map(g => `<span class="popup-gain">${g}</span>`).join('') : '<span class="popup-gain">No gains</span>';
        document.getElementById('popup').classList.add('show');
      }

      function closePopup() {
        document.getElementById('popup').classList.remove('show');
      }

      function animateGain(key, amount) {
        const badge = document.querySelector(`[data-gain="${key}"]`);
        if (!badge) return;
        badge.textContent = `+${amount}`;
        badge.classList.remove('show');
        void badge.offsetWidth;
        badge.classList.add('show');
      }

      function applyGrowthsForClass() {
        const selected = document.getElementById('class').value;
        if (selected === 'custom') return;
        const growthValues = classGrowths[selected];
        if (!growthValues) return;
        statMeta.forEach(([key], index) => {
          const input = getGrowthInput(key);
          if (input) input.value = growthValues[index];
        });
      }

      function levelUpOnce() {
        const gains = [];
        statMeta.forEach(([key, label, base, growth], index) => {
          const rate = Number(getGrowthInput(key)?.value ?? growth || 0);
          const chance = Math.random() * 100;
          const gain = chance < rate ? 1 : 0;
          if (!gain) return;
          stats[key] += 1;
          gains.push(`+1 ${label}`);
          animateGain(key, 1);
        });

        level += 1;
        document.getElementById('level').textContent = level;
        history.push({ level, gains });
        renderHistory();
        updateOutput(gains);
        showPopup(gains);
        playChime();
      }

      function simulateLevels() {
        const count = Math.max(1, Number(document.getElementById('amount').value) || 1);
        for (let i = 0; i < count; i++) {
          levelUpOnce();
        }
      }

      function saveState() {
        const payload = {
          title: document.getElementById('title').value,
          name: document.getElementById('name').value,
          className: document.getElementById('class').value,
          level,
          stats,
          growths: Object.fromEntries(statMeta.map(([key]) => [key, Number(getGrowthInput(key)?.value || 0)])),
          history,
        };
        localStorage.setItem('fe-build-state', JSON.stringify(payload));
      }

      function loadState() {
        const raw = localStorage.getItem('fe-build-state');
        if (!raw) return;
        try {
          const state = JSON.parse(raw);
          document.getElementById('title').value = state.title || 'Lord';
          document.getElementById('name').value = state.name || 'Eve';
          document.getElementById('class').value = state.className || 'custom';
          level = state.level || 1;
          stats = state.stats || { ...defaultStats };
          document.getElementById('level').textContent = level;
          history = state.history || [];
          statMeta.forEach(([key]) => {
            const input = getGrowthInput(key);
            if (input) input.value = state.growths?.[key] ?? 0;
          });
          renderHistory();
          updateOutput([]);
          renderStats();
        } catch (err) {
          console.error('Failed to load saved build', err);
        }
      }

      function exportJson() {
        const payload = {
          title: document.getElementById('title').value,
          name: document.getElementById('name').value,
          className: document.getElementById('class').value,
          level,
          stats,
          growths: Object.fromEntries(statMeta.map(([key]) => [key, Number(getGrowthInput(key)?.value || 0)])),
          history,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'fe-build.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function importJson(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const state = JSON.parse(reader.result);
            document.getElementById('title').value = state.title || 'Lord';
            document.getElementById('name').value = state.name || 'Eve';
            document.getElementById('class').value = state.className || 'custom';
            level = state.level || 1;
            stats = state.stats || { ...defaultStats };
            document.getElementById('level').textContent = level;
            history = state.history || [];
            statMeta.forEach(([key]) => {
              const input = getGrowthInput(key);
              if (input) input.value = state.growths?.[key] ?? 0;
            });
            renderHistory();
            updateOutput([]);
            renderStats();
          } catch (err) {
            alert('Invalid JSON build file');
          }
        };
        reader.readAsText(file);
      }

      function compareBuilds() {
        if (!savedCompare) {
          document.getElementById('comparison').textContent = 'Save a comparison build first.';
          return;
        }
        const rows = statMeta.map(([key, label]) => {
          const oldVal = savedCompare.stats[key] || 0;
          const newVal = stats[key] || 0;
          const diff = newVal - oldVal;
          return `
            <tr>
              <td>${label}</td>
              <td>${oldVal}</td>
              <td>${newVal}</td>
              <td style="color:${diff >= 0 ? '#86efac' : '#fca5a5'}; font-weight:800;">${diff >= 0 ? '+' : ''}${diff}</td>
            </tr>
          `;
        }).join('');

        document.getElementById('comparison').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Stat</th>
                <th>Saved</th>
                <th>Current</th>
                <th>Diff</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function resetAll() {
        level = 1;
        stats = { ...defaultStats };
        history = [];
        document.getElementById('level').textContent = level;
        statMeta.forEach(([key, label, base, growth]) => {
          const input = getGrowthInput(key);
          if (input) input.value = growth;
        });
        renderHistory();
        updateOutput([]);
        renderStats();
      }

      function toggleSettings() {
        settingsOpen = !settingsOpen;
        const panel = document.getElementById('settingsPanel');
        panel.classList.toggle('open', settingsOpen);
        document.getElementById('settingsText').textContent = settingsOpen ? 'Hide' : 'Show';
      }

      function setup() {
        renderStats();
        renderHistory();
        updateOutput([]);

        document.getElementById('settingsToggle').addEventListener('click', toggleSettings);
        document.getElementById('sound').addEventListener('click', () => {
          soundEnabled = !soundEnabled;
          document.getElementById('sound').textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
        });
        document.getElementById('apply').addEventListener('click', () => {
          applyGrowthsForClass();
          updateOutput([]);
        });
        document.getElementById('levelUp').addEventListener('click', levelUpOnce);
        document.getElementById('simulate').addEventListener('click', simulateLevels);
        document.getElementById('reset').addEventListener('click', resetAll);
        document.getElementById('copy').addEventListener('click', () => navigator.clipboard.writeText(document.getElementById('output').value));
        document.getElementById('saveCompare').addEventListener('click', () => {
          savedCompare = { stats: { ...stats } };
          document.getElementById('comparison').textContent = 'Saved comparison build.';
        });
        document.getElementById('compare').addEventListener('click', compareBuilds);
        document.getElementById('save').addEventListener('click', saveState);
        document.getElementById('load').addEventListener('click', loadState);
        document.getElementById('export').addEventListener('click', exportJson);
        document.getElementById('import').addEventListener('change', (e) => importJson(e.target.files[0]));
        document.getElementById('closePopup').addEventListener('click', closePopup);
        document.getElementById('portraitInput').addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = document.createElement('img');
            img.src = event.target.result;
            const portrait = document.getElementById('portrait');
            portrait.innerHTML = '';
            portrait.appendChild(img);
            document.getElementById('removePortrait').style.display = 'block';
          };
          reader.readAsDataURL(file);
        });
        document.getElementById('removePortrait').addEventListener('click', () => {
          const portrait = document.getElementById('portrait');
          portrait.innerHTML = '🧙';
          document.getElementById('portraitInput').value = '';
          document.getElementById('removePortrait').style.display = 'none';
        });
        document.getElementById('title').addEventListener('input', setHeroName);
        document.getElementById('name').addEventListener('input', setHeroName);
        document.getElementById('class').addEventListener('change', () => {
          if (document.getElementById('class').value !== 'custom') applyGrowthsForClass();
        });
        document.getElementById('historyToggle').addEventListener('change', () => {
          const visible = document.getElementById('historyToggle').checked;
          document.getElementById('history').style.display = visible ? 'grid' : 'none';
        });
      }

      setup();
    </script>
  </body>
</html>
