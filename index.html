<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FE Stat Growth Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;600;700&display=swap');
:root{--gold:#fbbf24;--ink:#07111f}*{box-sizing:border-box}body{font-family:Inter,sans-serif;background:radial-gradient(circle at top,#263b5c 0,#0b1322 45%,#030712 100%)}h1,h2,.crest{font-family:Cinzel,serif}.panel{background:linear-gradient(145deg,#17263b,#0c1627);border:1px solid #475569;box-shadow:0 18px 45px #0008}.label{display:block;margin-bottom:.3rem;color:#94a3b8;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.input,.num{width:100%;border:1px solid #475569;border-radius:.5rem;background:#26364d;color:#fff;padding:.55rem .7rem;outline:0}.input:focus,.num:focus{border-color:var(--gold);box-shadow:0 0 0 2px #fbbf2433}.num{width:5rem;text-align:center;padding:.35rem}.flash{animation:glow .8s ease-out}@keyframes glow{0%{background:#22c55e66}100%{background:transparent}}.crest{color:var(--gold);text-shadow:0 0 18px #f59e0b88}.portrait{background:linear-gradient(135deg,#b7791f44,#08111f)}
</style>
</head>
<body class="min-h-screen px-4 py-8 text-slate-100">
<main class="mx-auto max-w-7xl panel rounded-2xl p-5 md:p-8">
<header class="mb-7 border-b border-slate-700 pb-6 text-center"><div class="crest mb-2 text-4xl">⚜</div><h1 class="text-3xl font-extrabold tracking-wide text-amber-400 md:text-4xl">FIRE EMBLEM GROWTH CHRONICLE</h1><p class="mt-2 text-sm text-slate-400">Plan, compare, and simulate your characters.</p></header>
<section class="mb-6 grid gap-6 rounded-xl border border-slate-700 bg-slate-950/40 p-5 md:grid-cols-[180px_1fr]">
<div class="flex flex-col items-center"><div id="portrait" class="portrait flex h-40 w-40 items-center justify-center overflow-hidden rounded-xl border-2 border-amber-500/70 text-5xl">🧙</div><label for="portraitInput" class="mt-3 cursor-pointer rounded-lg bg-slate-700 px-4 py-2 text-sm font-bold hover:bg-slate-600">Upload Portrait</label><input id="portraitInput" type="file" accept="image/*" class="hidden"><button id="removePortrait" class="mt-2 hidden text-xs text-red-400">Remove Portrait</button></div>
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><label><span class="label">Title / Role</span><input id="title" value="Lord" class="input"></label><label><span class="label">Character Name</span><input id="name" value="Eve" class="input"></label><label><span class="label">Game Preset</span><select id="game" class="input"><option value="generic">Generic</option><option value="fe7">FE7 style</option><option value="fe8">FE8 style</option><option value="fe13">Awakening style</option><option value="fe14">Fates style</option><option value="fe16">Three Houses style</option></select></label><label><span class="label">Class</span><select id="class" class="input"><option value="custom">Custom</option><option>Lord</option><option>Cavalier</option><option>Knight</option><option>Mage</option><option>Myrmidon</option><option>Thief</option><option>Cleric</option><option>Archer</option></select></label><div class="flex gap-2 sm:col-span-2 lg:col-span-4"><button id="apply" class="rounded-lg bg-indigo-600 px-4 py-2 font-bold hover:bg-indigo-500">Apply Class Growths</button><button id="soundToggle" class="rounded-lg bg-slate-700 px-4 py-2 font-bold hover:bg-slate-600">🔊 Sound On</button></div></div></section>
<section class="mb-6 flex flex-wrap items-center justify-between gap-4 rounded-xl border border-slate-700 bg-slate-950/40 p-4"><div class="text-center"><span class="label">Current Level</span><b id="level" class="text-5xl text-amber-400">1</b></div><div class="flex flex-wrap items-center gap-2"><label class="flex items-center gap-2 rounded-lg border border-slate-700 bg-slate-800 px-3 py-2"><span class="label mb-0">Levels</span><input id="amount" type="number" min="1" value="1" class="num"></label><button id="simulate" class="rounded-lg bg-teal-600 px-4 py-3 font-bold hover:bg-teal-500">Simulate</button><button id="levelUp" class="rounded-lg bg-emerald-600 px-6 py-3 text-lg font-bold hover:bg-emerald-500">✨ Level Up!</button><button id="reset" class="rounded-lg bg-slate-700 px-5 py-3 hover:bg-slate-600">🔄 Reset</button></div></section>
<section class="overflow-x-auto rounded-xl border border-slate-700"><table class="w-full border-collapse text-left"><thead><tr class="bg-slate-950/70 text-xs font-bold uppercase tracking-wider text-amber-400"><th class="p-3">Stat</th><th class="p-3 text-center">Base</th><th class="p-3 text-center">Growth</th><th class="p-3 text-center">Current</th><th class="p-3 text-center">Expected / Level</th><th class="p-3 text-center">Bonus Chance</th></tr></thead><tbody id="stats"></tbody></table></section>
<section class="mt-6 grid gap-6 lg:grid-cols-2"><div class="rounded-xl border border-slate-700 bg-slate-950/50 p-4"><div class="mb-2 flex justify-between"><label class="label">📋 Discord Output</label><button id="copy" class="rounded bg-amber-500 px-3 py-1 text-xs font-bold text-slate-950">Copy</button></div><textarea id="output" readonly rows="6" class="w-full resize-none rounded border border-slate-800 bg-slate-950 p-3 font-mono text-sm text-emerald-400"></textarea></div><div class="rounded-xl border border-slate-700 bg-slate-950/50 p-4"><h2 class="mb-3 text-lg text-amber-300">Level History</h2><div id="history" class="max-h-48 space-y-2 overflow-y-auto text-sm"></div></div></section>
<section class="mt-6 rounded-xl border border-amber-500/40 bg-slate-950/50 p-5"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl text-amber-300">⚔ Compare Builds</h2><p class="text-xs text-slate-400">Save the current build, change it, then compare the two.</p></div><div class="flex gap-2"><button id="saveCompare" class="rounded-lg bg-purple-700 px-4 py-2 font-bold hover:bg-purple-600">Save Comparison</button><button id="compare" class="rounded-lg bg-amber-600 px-4 py-2 font-bold text-slate-950 hover:bg-amber-500">Compare</button></div></div><div id="comparison" class="overflow-x-auto text-sm text-slate-300">No comparison saved yet.</div></section>
<section class="mt-6 flex flex-wrap gap-2 rounded-xl border border-slate-700 bg-slate-950/50 p-4"><h2 class="mr-3 self-center text-lg text-amber-300">Build Files</h2><button id="export" class="rounded bg-blue-700 px-4 py-2 font-bold hover:bg-blue-600">Export JSON</button><label class="cursor-pointer rounded bg-slate-700 px-4 py-2 font-bold hover:bg-slate-600">Import JSON<input id="import" type="file" accept="application/json" class="hidden"></label><button id="save" class="rounded bg-emerald-700 px-4 py-2 font-bold hover:bg-emerald-600">Save Browser Build</button><button id="load" class="rounded bg-slate-700 px-4 py-2 font-bold hover:bg-slate-600">Load Browser Build</button></section>
</main>
<script>
const data=[['hp','HP',22,65],['str','Str',7,50],['mag','Mag',1,10],['skl','Skl',8,55],['spd','Spd',9,50],['lck','Lck',7,45],['def','Def',6,35],['res','Res',2,25]];
const base={Lord:[65,50,10,55,50,45,35,25],Cavalier:[70,45,5,45,45,35,40,15],Knight:[80,55,0,35,15,25,65,5],Mage:[45,10,70,45,40,35,10,55],Myrmidon:[50,40,5,65,70,45,20,15],Thief:[45,35,5,50,65,60,15,25],Cleric:[40,5,65,35,35,50,10,65],Archer:[55,45,5,70,40,35,25,15]};
const $=id=>document.getElementById(id);let level=1,stats={},history=[],savedCompare=null,sound=true,audio;
function build(){stats={};data.forEach(x=>stats[x[0]]=x[2]);$('stats').innerHTML=data.map(x=>`<tr class="border-t border-slate-700/60"><td class="p-3 font-bold">${x[1]}</td><td class="p-3 text-center"><input id="b-${x[0]}" value="${x[2]}" type="number" min="0" class="num"></td><td class="p-3 text-center"><input id="g-${x[0]}" value="${x[3]}" type="number" min="0" class="num">%</td><td id="c-${x[0]}" class="p-3 text-center text-xl font-black">${x[2]}<span id="a-${x[0]}" class="ml-1 block text-xs text-emerald-400 opacity-0"></span></td><td id="e-${x[0]}" class="p-3 text-center text-cyan-300"></td><td id="p-${x[0]}" class="p-3 text-center text-purple-300"></td></tr>`).join('');data.forEach(x=>{$('b-'+x[0]).onchange=()=>{x[2]=Math.max(0,+$('b-'+x[0]).value||0);if(level===1){stats[x[0]]=x[2];$('c-'+x[0]).childNodes[0].nodeValue=x[2]}out([])};$('g-'+x[0]).oninput=()=>{x[3]=Math.max(0,+$('g-'+x[0]).value||0);$('class').value='custom';prob()}});prob();out([])}
function prob(){data.forEach(x=>{let r=+$('g-'+x[0]).value||0;$('e-'+x[0]).textContent=(r/100).toFixed(2);$('p-'+x[0]).textContent=(r%100).toFixed(0)+'%'});}
function roll(){let gains=[];data.forEach(x=>{let r=+$('g-'+x[0]).value||0,g=Math.floor(r/100)+(Math.random()*100<r%100?1:0);if(!g)return;stats[x[0]]+=g;gains.push('+'+g+' '+x[0].toUpperCase());$('c-'+x[0]).childNodes[0].nodeValue=stats[x[0]];let a=$('a-'+x[0]),c=$('c-'+x[0]);a.textContent='+'+g;a.style.opacity=1;c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');setTimeout(()=>{a.style.opacity=0;c.classList.remove('flash')},900)});return gains}
function up(){level++;$('level').textContent=level;let gains=roll();history.push({level,gains});$('history').innerHTML=history.map(h=>`<div class="rounded border border-slate-700 bg-slate-800 p-2"><b class="text-amber-300">Level ${h.level}</b><br><span>${h.gains.length?h.gains.join(', '):'No gains'}</span></div>`).join('');out(gains);if(sound)chime()}
function out(g){let n=($('title').value.trim()+' '+$('name').value.trim()).trim()||'Character',s=data.map(x=>x[0].toUpperCase()+':'+stats[x[0]]).join(' | ');$('output').value=`**${n} reached Level ${level}!**\n⚔️ **Class:** ${$('class').value}\n✨ **Gains:** ${g.length?g.join(', '):'No stats went up! (Empty Level)'}\n📊 **New Stats:** ${s}`}
function apply(){let r=base[$('class').value];if(r)r.forEach((v,i)=>{$('g-'+data[i][0]).value=v;data[i][3]=v});prob();out([])}
function snapshot(){return{title:$('title').value,name:$('name').value,game:$('game').value,className:$('class').value,level,stats:{...stats},growths:Object.fromEntries(data.map(x=>[x[0],+$('g-'+x[0]).value||0]))}}
function compare(){if(!savedCompare){$('comparison').textContent='Save a comparison build first.';return}let rows=data.map(x=>{let a=savedCompare.stats[x[0]],b=stats[x[0]],d=b-a;return`<tr class="border-t border-slate-700"><td class="p-2">${x[1]}</td><td class="p-2 text-center">${a}</td><td class="p-2 text-center">${b}</td><td class="p-2 text-center ${d>=0?'text-emerald-400':'text-red-400'}">${d>=0?'+':''}${d}</td></tr>`}).join('');$('comparison').innerHTML=`<table class="w-full"><thead><tr class="text-amber-300"><th class="p-2 text-left">Stat</th><th class="p-2">Saved</th><th class="p-2">Current</th><th class="p-2">Difference</th></tr></thead><tbody>${rows}</tbody></table>`}
function chime(){audio??=new AudioContext;let now=audio.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(0,now+i*.09);g.gain.linearRampToValueAtTime(.12,now+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.09+.3);o.start(now+i*.09);o.stop(now+i*.09+.32)})}
function fileState(){return{...snapshot(),statConfig:data.map(x=>({...x})),history}}
function loadState(s){$('title').value=s.title||'Lord';$('name').value=s.name||'Eve';$('game').value=s.game||'generic';$('class').value=s.className||'custom';level=s.level||1;stats=s.stats||{};data.forEach(x=>{let z=s.statConfig?.find(y=>y[0]===x[0]);if(z){x[2]=z[2];x[3]=z[3]}});history=s.history||[];$('level').textContent=level;build();data.forEach(x=>{$('b-'+x[0]).value=x[2];$('g-'+x[0]).value=s.growths?.[x[0]]??x[3];$('c-'+x[0]).childNodes[0].nodeValue=stats[x[0]]??x[2]});prob();out([])}
$('levelUp').onclick=up;$('simulate').onclick=()=>{for(let i=0;i<Math.max(1,+$('amount').value||1);i++)up()};$('apply').onclick=apply;$('reset').onclick=()=>{level=1;history=[];build();$('level').textContent=1};['title','name','class'].forEach(id=>$(id).oninput=()=>out([]));$('copy').onclick=()=>navigator.clipboard.writeText($('output').value);$('soundToggle').onclick=()=>{sound=!sound;$('soundToggle').textContent=sound?'🔊 Sound On':'🔇 Sound Off'};$('saveCompare').onclick=()=>{savedCompare=snapshot();$('comparison').textContent='Comparison build saved. Change the current build, then click Compare.'};$('compare').onclick=compare;$('save').onclick=()=>localStorage.setItem('fe-build',JSON.stringify(fileState()));$('load').onclick=()=>{let s=localStorage.getItem('fe-build');if(s)loadState(JSON.parse(s))};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(fileState(),null,2)],{type:'application/json'}));a.download='fe-build.json';a.click();URL.revokeObjectURL(a.href)};$('import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{loadState(JSON.parse(r.result))}catch{alert('Invalid build file.')}};r.readAsText(f)};$('portraitInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=v=>{$('portrait').innerHTML=`<img src="${v.target.result}" class="h-full w-full object-cover" alt="Portrait">`;$('removePortrait').classList.remove('hidden')};r.readAsDataURL(f)};$('removePortrait').onclick=()=>{$('portrait').textContent='🧙';$('removePortrait').classList.add('hidden');$('portraitInput').value=''};build();
</script>
</body>
</html>
