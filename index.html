<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Emblem Stat Growth Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes pop{0%{opacity:0;transform:translateY(5px)}20%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
@keyframes flash{from{background:#14532d55}to{background:transparent}}
.gain-pop{animation:pop .85s ease-out forwards}.level-flash{animation:flash .9s ease-out}
.label{display:block;margin-bottom:.35rem;font-size:.65rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#94a3b8}
.field,.small-field{border:1px solid #475569;border-radius:.55rem;background:#334155;color:white;outline:0}.field{width:100%;padding:.62rem .7rem}.small-field{width:4.5rem;padding:.35rem .2rem;text-align:center}.field:focus,.small-field:focus{border-color:#facc15;box-shadow:0 0 0 2px #facc1520}
.btn{border:0;border-radius:.6rem;padding:.7rem 1rem;font-weight:800;transition:filter .15s,transform .1s}.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.98)}.gold{background:#facc15;color:#111827}.green{background:#16a34a;color:#fff}.slate{background:#475569;color:#fff}.blue{background:#2563eb;color:#fff}
</style>
</head>
<body class="min-h-screen bg-slate-950 px-4 py-8 font-sans text-slate-100">
<main class="mx-auto max-w-5xl rounded-2xl border border-slate-700 bg-slate-900/95 p-5 shadow-2xl">
<header class="mb-6 border-b border-slate-700 pb-4 text-center"><h1 class="text-3xl font-black tracking-[.16em] text-amber-400">FE STAT GROWTH</h1><p class="mt-2 text-sm text-slate-400">Build a character, simulate levels, and copy the result into Discord.</p></header>
<section class="mb-6 grid gap-5 rounded-xl border border-slate-700 bg-slate-800/70 p-4 md:grid-cols-[180px_1fr]">
<div class="flex flex-col items-center"><div id="portrait" class="flex h-32 w-32 items-center justify-center overflow-hidden rounded-xl border-2 border-amber-400/70 bg-gradient-to-br from-amber-500/20 to-slate-950 text-6xl">🧙</div><label for="portraitInput" class="mt-3 cursor-pointer rounded-lg bg-slate-700 px-3 py-2 text-xs font-bold hover:bg-slate-600">Upload Portrait</label><input id="portraitInput" type="file" accept="image/*" hidden><button id="removePortrait" class="mt-2 hidden text-xs font-semibold text-red-300" type="button">Remove Portrait</button></div>
<div class="grid gap-4 sm:grid-cols-2"><label><span class="label">Title / Role</span><input id="title" class="field" value="Lord"></label><label><span class="label">Character Name</span><input id="charName" class="field" value="Marth"></label><label><span class="label">Class</span><select id="classSelect" class="field"><option value="custom">Custom</option><option>Lord</option><option>Cavalier</option><option>Knight</option><option>Mage</option><option>Myrmidon</option><option>Thief</option><option>Cleric</option><option>Archer</option></select></label><div class="flex items-end gap-2"><button id="applyClass" class="btn gold w-full" type="button">Apply Class Growths</button><button id="soundBtn" class="btn slate whitespace-nowrap" type="button">🔊 Sound On</button></div></div>
</section>
<section class="mb-6 flex flex-wrap items-end justify-between gap-4 rounded-xl border border-slate-700 bg-slate-800/70 p-4"><div><div class="label">Current Level</div><div class="text-4xl font-black text-amber-400">Lv <span id="level">1</span></div></div><div class="flex flex-wrap items-end gap-2"><label class="w-24"><span class="label">Levels</span><input id="amount" class="field text-center" type="number" min="1" value="1"></label><button id="simulate" class="btn green" type="button">Simulate</button><button id="levelUp" class="btn gold" type="button">✨ Level Up</button><button id="reset" class="btn slate" type="button">Reset</button></div></section>
<section class="mb-6 overflow-hidden rounded-xl border border-slate-700 bg-slate-800/70"><table class="w-full border-collapse"><thead><tr class="bg-slate-950/60 text-left text-[10px] font-bold uppercase tracking-[.18em] text-amber-400"><th class="p-3">Stat</th><th class="p-3 text-center">Base</th><th class="p-3 text-center">Growth</th><th class="p-3 text-center">Current</th></tr></thead><tbody id="stats"></tbody></table></section>
<section class="grid gap-5 md:grid-cols-[1.25fr_.75fr]"><div class="rounded-xl border border-slate-700 bg-slate-950/60 p-4"><div class="mb-3 flex items-center justify-between"><h2 class="text-xs font-black uppercase tracking-[.14em] text-amber-400">Discord Ready Output</h2><button id="copy" class="btn blue px-3 py-1.5 text-xs" type="button">Copy Text</button></div><textarea id="output" readonly rows="6" class="field min-h-36 resize-none font-mono text-sm text-emerald-300"></textarea></div><div class="rounded-xl border border-slate-700 bg-slate-950/60 p-4"><div class="mb-3 flex items-center justify-between"><h2 class="text-xs font-black uppercase tracking-[.14em] text-amber-400">Level History</h2><button id="clearHistory" class="text-xs text-slate-400" type="button">Clear</button></div><div id="history" class="max-h-56 space-y-2 overflow-y-auto"></div></div></section>
</main>
<div id="popup" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/80 p-4"><div class="w-full max-w-md rounded-2xl border-2 border-amber-400 bg-slate-900 p-6 text-center shadow-2xl"><div class="text-xs font-bold uppercase tracking-[.2em] text-amber-400">Level Up!</div><div id="popupLevel" class="my-3 text-5xl font-black text-amber-400"></div><div id="popupGains" class="flex flex-wrap justify-center gap-2"></div><button id="closePopup" class="btn gold mt-6" type="button">Continue</button></div></div>
<script>
const meta=[['hp','HP',22,65],['str','Str',7,50],['mag','Mag',1,10],['skl','Skl',8,55],['spd','Spd',9,50],['lck','Lck',7,45],['def','Def',6,35],['res','Res',2,25]], classes={Lord:[65,50,10,55,50,45,35,25],Cavalier:[70,45,5,45,45,35,40,15],Knight:[80,55,0,35,15,25,65,5],Mage:[45,10,70,45,40,35,10,55],Myrmidon:[50,40,5,65,70,45,20,15],Thief:[45,35,5,50,65,60,15,25],Cleric:[40,5,65,35,35,50,10,65],Archer:[55,45,5,70,40,35,25,15]};
let level=1, stats=Object.fromEntries(meta.map(([id,,base])=>[id,base])), history=[], sound=true, audioContext=null, lastGains=[]; const $=id=>document.getElementById(id);
function render(){ $('stats').innerHTML=meta.map(([id,label,base,growth])=>`<tr id="row-${id}" class="border-b border-slate-700/60 hover:bg-slate-700/20"><td class="p-3 font-bold">${label}</td><td class="p-3 text-center"><input data-base="${id}" class="small-field" type="number" min="0" value="${base}"></td><td class="p-3 text-center"><input data-growth="${id}" class="small-field text-amber-300" type="number" min="0" value="${growth}">%</td><td class="p-3 text-center"><span id="value-${id}" class="relative text-xl font-black">${stats[id]}<span id="gain-${id}" class="absolute left-full ml-2 whitespace-nowrap text-xs text-emerald-400 opacity-0"></span></span></td></tr>`).join(''); document.querySelectorAll('[data-base]').forEach(x=>x.oninput=e=>{let m=meta.find(s=>s[0]===e.target.dataset.base),v=Math.max(0,parseInt(e.target.value)||0);m[2]=v;if(level===1){stats[m[0]]=v;$(`value-${m[0]}`).textContent=v}});document.querySelectorAll('[data-growth]').forEach(x=>x.oninput=e=>{let m=meta.find(s=>s[0]===e.target.dataset.growth);m[3]=Math.max(0,parseInt(e.target.value)||0)});}
function historyRender(){ $('history').innerHTML=history.length?history.map(x=>`<div class="rounded-lg border border-slate-700 bg-slate-800/70 p-2 text-xs"><b class="text-amber-300">Level ${x.level}</b><div class="mt-1">${x.gains.length?x.gains.join(', '):'No stats went up'}</div></div>`).join(''):'<div class="rounded-lg border border-dashed border-slate-700 p-4 text-center text-sm text-slate-500">No level-ups yet.</div>';}
function output(g=lastGains){let n=`${$('title').value.trim()} ${$('charName').value.trim()}`.trim()||'Character';$('output').value=`**${n} reached Level ${level}!**\n⚔️ **Class:** ${$('classSelect').value}\n✨ **Gains:** ${g.length?g.join(', '):'No stats went up!'}\n📊 **Stats:** ${meta.map(([id,l])=>`${l}:${stats[id]}`).join(' | ')}`;}
function animate(id,n){let b=$(`gain-${id}`);b.textContent=`+${n}`;b.classList.remove('opacity-0','gain-pop');void b.offsetWidth;b.classList.add('opacity-100','gain-pop');$(`row-${id}`).classList.add('level-flash');setTimeout(()=>{b.classList.add('opacity-0');b.classList.remove('opacity-100','gain-pop');$(`row-${id}`).classList.remove('level-flash')},900)}
function chime(){if(!sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioContext)audioContext=new C();if(audioContext.state==='suspended')audioContext.resume();let o=audioContext.createOscillator(),g=audioContext.createGain();o.type='triangle';o.frequency.setValueAtTime(660,audioContext.currentTime);o.frequency.exponentialRampToValueAtTime(990,audioContext.currentTime+.16);g.gain.setValueAtTime(.001,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.14,audioContext.currentTime+.025);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.3);o.connect(g).connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.32)}catch(e){console.warn('Sound unavailable',e)}}
function levelUp(show=true){chime();let gains=[];meta.forEach(([id,label,,growth])=>{let r=Math.max(0,parseInt(document.querySelector(`[data-growth="${id}"]`).value)||0),n=Math.floor(r/100)+(Math.random()*100<r%100?1:0);if(n){stats[id]+=n;$(`value-${id}`).textContent=stats[id];gains.push(`+${n} ${label}`);animate(id,n)}});level+=1;$('level').textContent=level;lastGains=gains;history.push({level,gains});historyRender();output(gains);if(show)popup(gains,1);return gains}
function popup(gains,count){$('popupLevel').textContent=count>1?`Lv ${level} (+${count} levels)`:`Lv ${level}`;$('popupGains').innerHTML=gains.length?gains.map(g=>`<span class="rounded-full border border-emerald-500/70 bg-emerald-500/10 px-3 py-1 text-sm font-bold text-emerald-100">${g}</span>`).join(''):'<span class="rounded-full border border-slate-600 px-3 py-1 text-sm">No gains</span>'
$('popup').classList.remove('hidden');$('popup').classList.add('grid')}
function close(){ $('popup').classList.add('hidden');$('popup').classList.remove('grid') }
function simulate(){let n=Math.min(100,Math.max(1,parseInt($('amount').value)||1)),all=[];for(let i=0;i<n;i++)all=levelUp(false).concat(all);popup(all,n)}
function reset(){level=1;stats=Object.fromEntries(meta.map(([id,,base])=>[id,base]));history=[];lastGains=[];$('level').textContent=1;render();historyRender();output([]);close()}
function apply(){let v=classes[$('classSelect').value];if(v)v.forEach((x,i)=>document.querySelector(`[data-growth="${meta[i][0]}"]`).value=x)}
$('levelUp').onclick=()=>levelUp(true);$('simulate').onclick=simulate;$('reset').onclick=reset;$('applyClass').onclick=apply;$('classSelect').onchange=()=>{if($('classSelect').value!=='custom')apply()};$('closePopup').onclick=close;$('popup').onclick=e=>{if(e.target===$('popup'))close()};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 Sound On':'🔇 Sound Off'};$('clearHistory').onclick=()=>{history=[];historyRender()};$('title').oninput=$('charName').oninput=()=>output();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy Text',1200)}catch(e){$('output').select();document.execCommand('copy')}};
$('portraitInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{$('portrait').innerHTML=`<img src="${x.target.result}" class="h-full w-full object-cover" alt="Portrait">`;$('removePortrait').classList.remove('hidden')};r.readAsDataURL(f)};$('removePortrait').onclick=()=>{$('portrait').textContent='🧙';$('portraitInput').value='';$('removePortrait').classList.add('hidden')};render();historyRender();output([]);
</script>
</body></html>
