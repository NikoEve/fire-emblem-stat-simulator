<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FE Stat Growth Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@keyframes glow{0%{background:#22c55e66}100%{background:transparent}}.flash{animation:glow .8s ease-out}</style>
</head>
<body class="min-h-screen bg-slate-950 p-4 py-8 font-sans text-slate-100">
<main class="mx-auto max-w-6xl rounded-2xl border border-slate-700 bg-slate-800 p-6 shadow-2xl">
<header class="mb-6 border-b border-slate-700 pb-5 text-center"><h1 class="text-3xl font-extrabold tracking-wide text-amber-400">🛡️ FE STAT GROWTH SIMULATOR</h1><p class="mt-2 text-sm text-slate-400">Customize your character, class, portrait, and growth rates.</p></header>
<section class="mb-6 grid gap-6 rounded-xl border border-slate-700 bg-slate-900/50 p-5 md:grid-cols-[180px_1fr]">
<div class="flex flex-col items-center"><div id="portrait" class="flex h-40 w-40 items-center justify-center overflow-hidden rounded-xl border-2 border-amber-500/60 bg-slate-950 text-5xl">🧙</div><label for="portraitInput" class="mt-3 cursor-pointer rounded-lg bg-slate-700 px-4 py-2 text-sm font-bold">Upload Portrait</label><input id="portraitInput" type="file" accept="image/*" class="hidden"><button id="removePortrait" class="mt-2 hidden text-xs text-red-400">Remove Portrait</button></div>
<div class="grid content-start gap-4 sm:grid-cols-2"><label><span class="label">Title / Role</span><input id="title" value="Lord" class="input"></label><label><span class="label">Character Name</span><input id="name" value="Eve" class="input"></label><label><span class="label">Class</span><select id="class" class="input"><option value="custom">Custom</option><option>Lord</option><option>Cavalier</option><option>Knight</option><option>Mage</option><option>Myrmidon</option><option>Thief</option><option>Cleric</option><option>Archer</option></select></label><button id="apply" class="rounded-lg bg-indigo-600 px-4 py-2 font-bold hover:bg-indigo-500">Apply Class Growths</button></div>
</section>
<section class="mb-6 flex flex-wrap items-center justify-between gap-4 rounded-xl border border-slate-700 bg-slate-900/50 p-4"><div class="text-center"><span class="label">Current Level</span><b id="level" class="text-4xl text-amber-400">1</b></div><div class="flex gap-2"><button id="up" class="rounded-lg bg-emerald-600 px-6 py-3 text-lg font-bold hover:bg-emerald-500">✨ Level Up!</button><button id="reset" class="rounded-lg bg-slate-700 px-5 py-3 hover:bg-slate-600">🔄 Reset</button></div></section>
<div class="overflow-x-auto"><table class="w-full border-collapse text-left"><thead><tr class="border-b border-slate-700 bg-slate-900/60 text-xs font-bold uppercase text-amber-400"><th class="p-3">Stat</th><th class="p-3 text-center">Base</th><th class="p-3 text-center">Growth %</th><th class="p-3 text-center">Current</th></tr></thead><tbody id="stats"></tbody></table></div>
<section class="mt-8 rounded-xl border border-slate-700 bg-slate-900 p-4"><div class="mb-2 flex justify-between"><label class="label">📋 Discord Ready Output</label><button id="copy" class="rounded bg-amber-500 px-3 py-1 text-xs font-bold text-slate-950">Copy Text</button></div><textarea id="output" readonly rows="5" class="w-full resize-none rounded border border-slate-800 bg-slate-950 p-3 font-mono text-sm text-emerald-400"></textarea></section>
</main>
<script>
const rates={Lord:[65,50,10,55,50,45,35,25],Cavalier:[70,45,5,45,45,35,40,15],Knight:[80,55,0,35,15,25,65,5],Mage:[45,10,70,45,40,35,10,55],Myrmidon:[50,40,5,65,70,45,20,15],Thief:[45,35,5,50,65,60,15,25],Cleric:[40,5,65,35,35,50,10,65],Archer:[55,45,5,70,40,35,25,15]};
const data=[['hp','HP (Health)',22,65],['str','Str (Strength)',7,50],['mag','Mag (Magic)',1,10],['skl','Skl (Skill/Dex)',8,55],['spd','Spd (Speed)',9,50],['lck','Lck (Luck)',7,45],['def','Def (Defense)',6,35],['res','Res (Resistance)',2,25]];let lv=1,stats={};
const $=id=>document.getElementById(id);function init(){stats={};data.forEach(x=>stats[x[0]]=x[2]);$('stats').innerHTML=data.map(x=>`<tr class="border-b border-slate-700/50"><td class="p-3">${x[1]}</td><td class="p-3 text-center"><input id="b-${x[0]}" type="number" min="0" value="${x[2]}" class="num"></td><td class="p-3 text-center"><input id="g-${x[0]}" type="number" min="0" value="${x[3]}" class="num">%</td><td id="c-${x[0]}" class="p-3 text-center text-xl font-black">${x[2]}<span id="gain-${x[0]}" class="ml-1 block text-xs text-emerald-400 opacity-0"></span></td></tr>`).join('');data.forEach(x=>{ $('b-'+x[0]).onchange=()=>{x[2]=Math.max(0,+$('b-'+x[0]).value||0);if(lv===1){stats[x[0]]=x[2];$('c-'+x[0]).childNodes[0].nodeValue=x[2]}out([])} });out([])}
function out(g){let n=($('title').value.trim()+' '+$('name').value.trim()).trim()||'Character';let st=data.map(x=>x[0].toUpperCase()+':'+stats[x[0]]).join(' | ');$('output').value=`**${n} reached Level ${lv}!**\n⚔️ **Class:** ${$('class').value}\n✨ **Gains:** ${g.length?g.join(', '):'No stats went up! (Empty Level)'}\n📊 **New Stats:** ${st}`}
$('up').onclick=()=>{lv++;$('level').textContent=lv;let g=[];data.forEach(x=>{let r=+$('g-'+x[0]).value||0,a=Math.floor(r/100)+(Math.random()*100<r%100?1:0);if(a){stats[x[0]]+=a;$('c-'+x[0]).childNodes[0].nodeValue=stats[x[0]];let e=$('gain-'+x[0]);e.textContent='+'+a;e.style.opacity=1;$('c-'+x[0]).classList.add('flash');setTimeout(()=>{e.style.opacity=0;$('c-'+x[0]).classList.remove('flash')},900);g.push('+'+a+' '+x[0].toUpperCase())}});out(g)};
$('apply').onclick=()=>{let r=rates[$('class').value];if(r)r.forEach((v,i)=>$('g-'+data[i][0]).value=v);out([])};$('reset').onclick=()=>{lv=1;$('level').textContent=1;init()};['title','name','class'].forEach(id=>$(id).oninput=()=>out([]));$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy Text',1200)};$('portraitInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=ev=>{$('portrait').innerHTML=`<img src="${ev.target.result}" class="h-full w-full object-cover">`;$('removePortrait').classList.remove('hidden')};r.readAsDataURL(f)};$('removePortrait').onclick=()=>{$('portrait').textContent='🧙';$('removePortrait').classList.add('hidden');$('portraitInput').value=''};init();
</script>
<style>.label{display:block;margin-bottom:.25rem;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8}.input{width:100%;border-radius:.25rem;border:1px solid #475569;background:#334155;padding:.5rem;color:white;outline:0}.input:focus,.num:focus{border-color:#fbbf24}.num{width:5rem;border-radius:.25rem;border:1px solid #475569;background:#334155;padding:.25rem;text-align:center;color:white;outline:0}</style>
</body></html>
