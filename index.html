<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Emblem Stat Growth Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes levelUpGlow {
        0% { background-color: rgba(34, 197, 94, 0.14); }
        100% { background-color: transparent; }
      }

      .level-up-flash {
        animation: levelUpGlow 0.9s ease-out;
      }

      .gain-pop {
        animation: pop 0.8s ease-out;
      }

      @keyframes pop {
        0% { opacity: 0; transform: translateY(4px); }
        25% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-8px); }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 px-4 py-8 font-sans">
    <div class="mx-auto max-w-5xl rounded-2xl border border-slate-700 bg-slate-900/95 p-5 shadow-2xl shadow-slate-950/60 ring-1 ring-slate-800">
      <header class="mb-6 border-b border-slate-700 pb-4 text-center">
        <h1 class="text-3xl font-black tracking-[0.18em] text-amber-400">FE STAT GROWTH</h1>
        <p class="mt-2 text-sm text-slate-400">Level up, compare gains, and copy the result into Discord.</p>
      </header>

      <div class="mb-6 flex flex-wrap items-center justify-between gap-4 rounded-xl border border-slate-700 bg-slate-800/80 p-4">
        <div class="flex items-center gap-5">
          <label class="block">
            <span class="mb-1 block text-[10px] font-bold uppercase tracking-[0.18em] text-slate-400">Character</span>
            <input id="charName" type="text" value="Marth" class="w-40 rounded-lg border border-slate-600 bg-slate-700 px-2 py-2 text-base font-semibold text-white outline-none transition focus:border-amber-400" />
          </label>

          <div class="text-center">
            <span class="mb-1 block text-[10px] font-bold uppercase tracking-[0.18em] text-slate-400">Level</span>
            <span id="displayLevel" class="text-3xl font-black text-amber-400">1</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="levelUpBtn" class="rounded-lg bg-emerald-600 px-5 py-3 text-base font-bold text-white shadow-lg shadow-emerald-900/40 transition hover:bg-emerald-500 active:scale-[0.98]">✨ Level Up</button>
          <button id="resetBtn" class="rounded-lg bg-slate-700 px-4 py-3 text-sm font-semibold text-slate-200 transition hover:bg-slate-600 active:scale-[0.98]">Reset</button>
        </div>
      </div>

      <div class="overflow-hidden rounded-xl border border-slate-700 bg-slate-800/70">
        <table class="w-full border-collapse text-left">
          <thead>
            <tr class="bg-slate-900/60 text-[10px] font-bold uppercase tracking-[0.2em] text-amber-400">
              <th class="p-3">Stat</th>
              <th class="p-3 text-center">Base</th>
              <th class="p-3 text-center">Growth</th>
              <th class="p-3 text-center">Current</th>
            </tr>
          </thead>
          <tbody id="statTableBody"></tbody>
        </table>
      </div>

      <div class="mt-6 rounded-xl border border-slate-700 bg-slate-900/70 p-4">
        <div class="mb-3 flex items-center justify-between">
          <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">Discord Ready Output</label>
          <button id="copyBtn" class="rounded-md bg-amber-500 px-3 py-1.5 text-xs font-bold text-slate-900 transition hover:bg-amber-400 active:scale-[0.98]">Copy Text</button>
        </div>
        <textarea id="discordOutput" readonly rows="4" class="w-full resize-none rounded-lg border border-slate-800 bg-slate-950 p-3 font-mono text-sm text-emerald-300 outline-none"></textarea>
      </div>
    </div>

    <script>
      const statConfig = [
        { id: 'hp', name: 'HP (Health)', base: 22, growth: 65 },
        { id: 'str', name: 'Str (Strength)', base: 7, growth: 50 },
        { id: 'mag', name: 'Mag (Magic)', base: 1, growth: 10 },
        { id: 'skl', name: 'Skl (Skill/Dex)', base: 8, growth: 55 },
        { id: 'spd', name: 'Spd (Speed)', base: 9, growth: 50 },
        { id: 'lck', name: 'Lck (Luck)', base: 7, growth: 45 },
        { id: 'def', name: 'Def (Defense)', base: 6, growth: 35 },
        { id: 'res', name: 'Res (Resistance)', base: 2, growth: 25 }
      ];

      let currentLevel = 1;
      let currentStats = {};

      function renderStats() {
        const tbody = document.getElementById('statTableBody');
        tbody.innerHTML = '';

        statConfig.forEach((stat) => {
          currentStats[stat.id] = stat.base;

          const row = document.createElement('tr');
          row.className = 'border-b border-slate-700/60 transition hover:bg-slate-750/30';

          row.innerHTML = `
            <td class="p-3 font-semibold text-slate-200">${stat.name}</td>
            <td class="p-3 text-center">
              <input data-base-input="${stat.id}" type="number" value="${stat.base}" min="0" class="w-20 rounded-md border border-slate-600 bg-slate-700 px-2 py-1 text-center text-sm text-white outline-none transition focus:border-amber-400" />
            </td>
            <td class="p-3 text-center">
              <input data-growth-input="${stat.id}" type="number" value="${stat.growth}" min="0" max="255" class="w-20 rounded-md border border-slate-600 bg-slate-700 px-2 py-1 text-center text-sm text-amber-300 outline-none transition focus:border-amber-400" />%
            </td>
            <td id="current-box-${stat.id}" class="p-3 text-center">
              <div class="relative inline-flex items-center justify-center">
                <span id="current-${stat.id}" class="text-xl font-black text-white">${stat.base}</span>
                <span id="gain-${stat.id}" class="absolute left-full ml-2 text-xs font-bold text-emerald-400 opacity-0">+1</span>
              </div>
            </td>
          `;

          tbody.appendChild(row);
        });

        bindInputs();
        updateDiscordText([]);
      }

      function bindInputs() {
        statConfig.forEach((stat) => {
          const baseInput = document.querySelector(`[data-base-input="${stat.id}"]`);
          const growthInput = document.querySelector(`[data-growth-input="${stat.id}"]`);

          baseInput.addEventListener('input', (e) => {
            const newBase = Number.parseInt(e.target.value, 10) || 0;
            const configItem = statConfig.find((s) => s.id === stat.id);
            configItem.base = newBase;

            if (currentLevel === 1) {
              currentStats[stat.id] = newBase;
              document.getElementById(`current-${stat.id}`).textContent = newBase;
            }
          });

          growthInput.addEventListener('input', (e) => {
            const configItem = statConfig.find((s) => s.id === stat.id);
            configItem.growth = Number.parseInt(e.target.value, 10) || 0;
          });
        });
      }

      function updateDiscordText(gains) {
        const name = document.getElementById('charName').value.trim() || 'Character';
        const textarea = document.getElementById('discordOutput');

        const gainsText = gains.length > 0 ? gains.join(', ') : 'No stats went up!';
        const block = `**${name} reached Level ${currentLevel}!**\n✨ **Gains:** ${gainsText}\n`;
        textarea.value = block;
      }

      function animateGain(statId, amount) {
        const currentSpan = document.getElementById(`current-${statId}`);
        const gainSpan = document.getElementById(`gain-${statId}`);
        const parentBox = document.getElementById(`current-box-${statId}`);

        currentSpan.textContent = currentStats[statId];
        gainSpan.textContent = `+${amount}`;
        gainSpan.classList.remove('opacity-0', 'gain-pop');
        gainSpan.classList.add('opacity-100', 'gain-pop');
        parentBox.classList.add('level-up-flash');

        setTimeout(() => {
          gainSpan.classList.remove('gain-pop');
          gainSpan.classList.add('opacity-0');
          parentBox.classList.remove('level-up-flash');
        }, 850);
      }

      function levelUp() {
        currentLevel += 1;
        document.getElementById('displayLevel').textContent = currentLevel;

        const gains = [];

        statConfig.forEach((stat) => {
          let growth = stat.growth;
          let gained = 0;

          while (growth > 0) {
            if (growth >= 100) {
              gained += 1;
              growth -= 100;
              continue;
            }

            const roll = Math.floor(Math.random() * 100) + 1;
            if (roll <= growth) {
              gained += 1;
            }
            break;
          }

          if (gained > 0) {
            currentStats[stat.id] += gained;
            gains.push(`+${gained} ${stat.id.toUpperCase()}`);
            animateGain(stat.id, gained);
          }
        });

        updateDiscordText(gains);
      }

      function resetSim() {
        currentLevel = 1;
        document.getElementById('displayLevel').textContent = currentLevel;

        statConfig.forEach((stat) => {
          stat.base = stat.base;
          stat.growth = stat.growth;
        });

        currentStats = {};
        renderStats();
      }

      document.getElementById('levelUpBtn').addEventListener('click', levelUp);
      document.getElementById('resetBtn').addEventListener('click', resetSim);
      document.getElementById('copyBtn').addEventListener('click', async () => {
        const output = document.getElementById('discordOutput').value;
        try {
          await navigator.clipboard.writeText(output);
          const btn = document.getElementById('copyBtn');
          const original = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = original; }, 1200);
        } catch (err) {
          console.error('Copy failed:', err);
        }
      });

      renderStats();
    </script>
  </body>
</html>
